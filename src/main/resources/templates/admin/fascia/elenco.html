<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fasce orarie')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1>Fasce orarie</h1>
            <p class="lead">Gestisci gli slot base del calendario e assegna i turni dei toelettatori.</p>
        </div>

        <div class="action-group">
            <a th:href="@{/admin/fasce-orarie/genera}" class="btn btn-primary">Genera fasce</a>
            <a th:href="@{/admin/fasce-orarie/assegna-turno}" class="btn btn-secondary">Assegna turno</a>
        </div>
    </div>


    <div th:if="${#lists.isEmpty(fasce)}" class="empty-state">
        <p>Non ci sono ancora fasce orarie.</p>
    </div>

    <div th:unless="${#lists.isEmpty(fasce)}" class="table-wrapper">
        <table class="table schedule-table">
            <thead>
            <tr>
                <th>Slot</th>
                <th>Turno</th>
                <th>Stato</th>
                <th>Azioni</th>
            </tr>
            </thead>

            <tbody>
            <th:block th:each="f, iter : ${fasce}">
                <tr class="schedule-day-row"
                    th:if="${iter.index == 0 or f.data != fasce[iter.index - 1].data}">
                    <td colspan="4">
                        <strong th:text="${#temporals.format(f.data, 'dd/MM/yyyy')}">01/06/2026</strong>
                    </td>
                </tr>

                <tr>
                    <td>
                        <strong>
                            <span th:text="${#temporals.format(f.oraInizio, 'HH:mm')}">09:00</span>
                            -
                            <span th:text="${#temporals.format(f.oraFine, 'HH:mm')}">09:30</span>
                        </strong>
                    </td>
                    <td>
                        <span th:if="${f.toelettatore != null}"
                              th:text="${f.toelettatore.nome + ' ' + f.toelettatore.cognome}">
                            Mario Rossi
                        </span>
                        <span th:unless="${f.toelettatore != null}" class="badge badge-muted">Non assegnato</span>
                    </td>
                    <td>
                        <span class="badge" th:if="${f.disponibile}">Libero</span>
                        <span class="badge badge-danger" th:unless="${f.disponibile}">Occupato</span>
                    </td>
                    <td>
                        <div class="action-group">
                            <a th:href="@{/admin/fasce-orarie/{id}/modifica(id=${f.id})}"
                               class="btn btn-secondary btn-sm">Modifica</a>

                            <form th:action="@{/admin/fasce-orarie/{id}/elimina(id=${f.id})}"
                                  method="post"
                                  class="inline-form"
                                  onsubmit="return confirm('Eliminare questa fascia oraria?')">
                                <button type="submit" class="btn btn-danger btn-sm">Elimina</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </th:block>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
