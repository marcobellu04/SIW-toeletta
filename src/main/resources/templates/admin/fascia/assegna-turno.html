<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Assegna turno')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container container-sm">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="form-card">
        <h2>Assegna turno</h2>

        <form th:action="@{/admin/fasce-orarie/assegna-turno}" method="post">
            <div class="form-group">
                <label for="toelettatoreId">Toelettatore</label>
                <select id="toelettatoreId" name="toelettatoreId" required class="form-control">
                    <option value="">Seleziona toelettatore</option>
                    <option th:each="t : ${toelettatori}"
                            th:value="${t.id}"
                            th:text="${t.nome + ' ' + t.cognome}">
                        Giulia Bianchi
                    </option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dataInizio">Dal</label>
                    <input id="dataInizio" type="date" name="dataInizio" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="dataFine">Al</label>
                    <input id="dataFine" type="date" name="dataFine" required class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label>Giorni del turno</label>

                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="MONDAY"> Lunedi
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="TUESDAY"> Martedi
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="WEDNESDAY"> Mercoledi
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="THURSDAY"> Giovedi
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="FRIDAY"> Venerdi
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="SATURDAY"> Sabato
                </label>
                <label class="checkbox-line">
                    <input type="checkbox" name="giorni" value="SUNDAY"> Domenica
                </label>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="oraInizio">Ora inizio turno</label>
                    <input id="oraInizio" type="time" name="oraInizio" value="09:00" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="oraFine">Ora fine turno</label>
                    <input id="oraFine" type="time" name="oraFine" value="14:00" required class="form-control">
                </div>
            </div>

            <div class="action-group">
                <button type="submit" class="btn btn-primary">Assegna turno</button>
                <a th:href="@{/admin/fasce-orarie}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
