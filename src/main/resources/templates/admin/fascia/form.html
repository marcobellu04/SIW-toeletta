<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Fascia oraria')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container container-sm">
    <div class="form-card">
        <h2 th:text="${fascia.id == null ? 'Nuova fascia oraria' : 'Modifica fascia oraria'}">Fascia oraria</h2>

        <form th:action="${fascia.id == null} ? @{/admin/fasce-orarie/nuova} : @{/admin/fasce-orarie/{id}/modifica(id=${fascia.id})}"
              method="post"
              th:object="${fascia}">

            <div class="form-group">
                <label for="toelettatoreId">Toelettatore</label>
                <select id="toelettatoreId" name="toelettatoreId" class="form-control">
                    <option value="">Non assegnato</option>
                    <option th:each="t : ${toelettatori}"
                            th:value="${t.id}"
                            th:selected="${fascia.toelettatore != null and fascia.toelettatore.id == t.id}"
                            th:text="${t.nome + ' ' + t.cognome}">
                        Mario Rossi
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="data">Data</label>
                <input id="data" type="date" th:field="*{data}" required class="form-control">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="oraInizio">Ora inizio</label>
                    <input id="oraInizio" type="time" th:field="*{oraInizio}" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="oraFine">Ora fine</label>
                    <input id="oraFine" type="time" th:field="*{oraFine}" required class="form-control">
                </div>
            </div>

            <div class="form-group" th:if="${fascia.id != null}">
                <label for="disponibile">Disponibile</label>
                <select id="disponibile" th:field="*{disponibile}" required class="form-control">
                    <option th:value="true">Si</option>
                    <option th:value="false">No</option>
                </select>
            </div>

            <div class="action-group">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a th:href="@{/admin/fasce-orarie}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
