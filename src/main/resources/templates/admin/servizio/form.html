<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Servizio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container container-sm">
    <div class="form-card">
        <h2 th:text="${servizio.id == null ? 'Nuovo servizio' : 'Modifica servizio'}">Servizio</h2>

        <form th:action="${servizio.id == null} ? @{/admin/servizi/nuovo} : @{/admin/servizi/{id}/modifica(id=${servizio.id})}"
              method="post"
              th:object="${servizio}">

            <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" type="text" th:field="*{nome}" required class="form-control">
            </div>

            <div class="form-group">
                <label for="descrizione">Descrizione</label>
                <textarea id="descrizione" th:field="*{descrizione}" required class="form-control"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="durataMinuti">Durata minuti</label>
                    <input id="durataMinuti" type="number" th:field="*{durataMinuti}" required min="1" class="form-control">
                </div>

                <div class="form-group">
                    <label for="prezzoBase">Prezzo base</label>
                    <input id="prezzoBase" type="number" step="0.01" th:field="*{prezzoBase}" required min="0" class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="attivo">Stato</label>
                <select id="attivo" th:field="*{attivo}" required class="form-control">
                    <option th:value="true">Attivo</option>
                    <option th:value="false">Non attivo</option>
                </select>
            </div>

            <div class="action-group">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a th:href="@{/admin/servizi}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
