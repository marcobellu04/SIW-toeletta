<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Toelettatore')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container container-sm">
    <div class="form-card">
        <h2 th:text="${toelettatore.id == null ? 'Nuovo toelettatore' : 'Modifica toelettatore'}">Toelettatore</h2>

        <form th:action="${toelettatore.id == null} ? @{/admin/toelettatori/nuovo} : @{/admin/toelettatori/{id}/modifica(id=${toelettatore.id})}"
              method="post"
              th:object="${toelettatore}">

            <div class="form-row">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input id="nome" type="text" th:field="*{nome}" required class="form-control">
                </div>

                <div class="form-group">
                    <label for="cognome">Cognome</label>
                    <input id="cognome" type="text" th:field="*{cognome}" required class="form-control">
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Telefono</label>
                <input id="telefono" type="text" th:field="*{telefono}" required class="form-control">
            </div>

            <div class="form-group">
                <label for="specializzazione">Specializzazione</label>
                <input id="specializzazione" type="text" th:field="*{specializzazione}" class="form-control">
            </div>

            <div class="form-group">
                <label for="attivo">Stato</label>
                <select id="attivo" th:field="*{attivo}" required class="form-control">
                    <option th:value="true">Attivo</option>
                    <option th:value="false">Non attivo</option>
                </select>
            </div>

            <div class="action-group">
                <button type="submit" class="btn btn-primary">Salva</button>
                <a th:href="@{/admin/toelettatori}" class="btn btn-secondary">Annulla</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
