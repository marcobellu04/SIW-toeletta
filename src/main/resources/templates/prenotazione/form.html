<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuova prenotazione')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="page-header">
        <div>
            <h1>Nuova prenotazione</h1>
            <p class="lead">Scegli servizio, toelettatore e giorno, poi seleziona uno degli orari disponibili.</p>
        </div>
    </div>

    <form th:action="@{/prenotazioni/nuova}" method="post" onsubmit="return controllaSlot()">
        <div class="form-card">
            <div class="form-row">
                <div class="form-group">
                    <label for="caneId">Cane</label>
                    <select id="caneId" name="caneId" required class="form-control">
                        <option value="">Seleziona cane</option>
                        <option th:each="c : ${cani}"
                                th:value="${c.id}"
                                th:text="${c.nome + ' - ' + c.razza}">
                            Luna - Barboncino
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="servizioId">Servizio</label>
                    <select id="servizioId" name="servizioId" required class="form-control" onchange="cercaDisponibilita()">
                        <option value="">Seleziona servizio</option>
                        <option th:each="s : ${servizi}"
                                th:value="${s.id}"
                                th:attr="data-durata=${s.durataMinuti}"
                                th:selected="${servizioSelezionatoId != null and s.id == servizioSelezionatoId}"
                                th:text="${s.nome + ' - ' + s.prezzoBase + ' euro'}">
                            Bagno - 25 euro
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="toelettatoreRichiesto">Toelettatore</label>
                    <select id="toelettatoreRichiesto" class="form-control" required onchange="cercaDisponibilita()">
                        <option value="">Seleziona toelettatore</option>
                        <option th:each="t : ${toelettatori}"
                                th:value="${t.id}"
                                th:text="${t.nome + ' ' + t.cognome}">
                            Giulia Bianchi
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="giornoRichiesto">Giorno</label>
                    <input id="giornoRichiesto" type="date" class="form-control" required onchange="cercaDisponibilita()">
                </div>
            </div>
        </div>

        <section class="availability-section">
            <input type="hidden" id="fasciaScelta" name="fasciaScelta">

            <div id="availability-empty" class="empty-state">
                <p>Seleziona servizio, toelettatore e giorno per vedere gli orari disponibili.</p>
            </div>

            <div id="availability-results" class="availability-grid">
                <button type="button"
                        th:each="f : ${fasceDisponibili}"
                        class="availability-card"
                        style="display: none;"
                        th:attr="data-value=${f.id},
                                 data-toelettatore=${f.toelettatore.id},
                                 data-date=${#temporals.format(f.data, 'yyyy-MM-dd')},
                                 data-date-label=${#temporals.format(f.data, 'dd/MM/yyyy')},
                                 data-start=${#temporals.format(f.oraInizio, 'HH:mm')},
                                 data-end=${#temporals.format(f.oraFine, 'HH:mm')}"
                        onclick="selezionaSlot(this)">
                    <span class="availability-time">
                        <span th:text="${#temporals.format(f.oraInizio, 'HH:mm')}">10:30</span>
                        -
                        <span th:text="${#temporals.format(f.oraFine, 'HH:mm')}">11:00</span>
                    </span>

                    <span class="availability-person"
                          th:text="${f.toelettatore.nome + ' ' + f.toelettatore.cognome}">
                        Giulia Bianchi
                    </span>

                    <span class="availability-date"
                          th:text="${#temporals.format(f.data, 'dd/MM/yyyy')}">
                        10/06/2026
                    </span>
                </button>
            </div>
        </section>

        <div class="form-card" style="margin-top: 1.5rem;">
            <div class="form-group">
                <label for="noteCliente">Note</label>
                <textarea id="noteCliente"
                          name="noteCliente"
                          class="form-control"
                          placeholder="Eventuali indicazioni per il toelettatore"></textarea>
            </div>
        </div>

        <div class="action-group" style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Conferma prenotazione</button>
            <a th:href="@{/prenotazioni}" class="btn btn-secondary">Annulla</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    function cercaDisponibilita() {
        const servizioSelect = document.getElementById('servizioId');
        const servizio = servizioSelect.value;
        const durata = getDurataServizio();
        const toelettatore = document.getElementById('toelettatoreRichiesto').value;
        const giorno = document.getElementById('giornoRichiesto').value;
        const cards = Array.from(document.querySelectorAll('.availability-card'));
        const empty = document.getElementById('availability-empty');

        document.getElementById('fasciaScelta').value = '';

        cards.forEach(function(card) {
            card.classList.remove('selected');
            card.style.display = 'none';
        });

        if (!servizio || !toelettatore || !giorno || !durata) {
            empty.innerHTML = '<p>Seleziona servizio, toelettatore e giorno per vedere gli orari disponibili.</p>';
            empty.style.display = 'block';
            return;
        }

        const slots = cards
            .filter(function(card) {
                return card.dataset.toelettatore === toelettatore && card.dataset.date === giorno;
            })
            .sort(function(a, b) {
                return a.dataset.start.localeCompare(b.dataset.start);
            });

        let trovate = 0;

        slots.forEach(function(card, index) {
            const end = calcolaFinePrenotazione(slots, index, durata);

            if (end) {
                card.querySelector('.availability-time').textContent = card.dataset.start + ' - ' + end;
                card.style.display = 'block';
                trovate++;
            }
        });

        if (trovate === 0) {
            empty.innerHTML = '<p>Nessun orario disponibile per il servizio, il toelettatore e il giorno selezionati.</p>';
            empty.style.display = 'block';
        } else {
            empty.style.display = 'none';
        }
    }

    function getDurataServizio() {
        const option = document.getElementById('servizioId').selectedOptions[0];
        return option && option.dataset.durata ? Number(option.dataset.durata) : 0;
    }

    function calcolaFinePrenotazione(slots, startIndex, durataRichiesta) {
        const primo = slots[startIndex];
        let minutiCoperti = 0;
        let fine = primo.dataset.end;

        for (let i = startIndex; i < slots.length; i++) {
            const slot = slots[i];

            if (slot.dataset.date !== primo.dataset.date) {
                return null;
            }

            if (i > startIndex && slots[i - 1].dataset.end !== slot.dataset.start) {
                return null;
            }

            minutiCoperti += minutiTra(slot.dataset.start, slot.dataset.end);
            fine = slot.dataset.end;

            if (minutiCoperti >= durataRichiesta) {
                return fine;
            }
        }

        return null;
    }

    function minutiTra(inizio, fine) {
        const inizioParti = inizio.split(':').map(Number);
        const fineParti = fine.split(':').map(Number);
        return (fineParti[0] * 60 + fineParti[1]) - (inizioParti[0] * 60 + inizioParti[1]);
    }

    function selezionaSlot(card) {
        document.querySelectorAll('.availability-card').forEach(function(c) {
            c.classList.remove('selected');
        });

        card.classList.add('selected');
        document.getElementById('fasciaScelta').value = card.dataset.value;
    }

    function controllaSlot() {
        if (!document.getElementById('fasciaScelta').value) {
            alert('Seleziona una disponibilita.');
            return false;
        }

        return true;
    }

    cercaDisponibilita();
</script>
</body>
</html>
